<!doctype html>
<html lang="en" data-aud="ops">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fork — One site. Two ways in.</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
@import url("tokens.css");
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.6;transition:background .4s,color .4s}
[data-aud=founders] body{font-size:.95rem}
.pad{padding-left:clamp(1rem,5vw,4.5rem);padding-right:clamp(1rem,5vw,4.5rem)}
.mast{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;padding-bottom:1rem;font-size:.85rem}
.logo{font:var(--display-weight) 1.5rem var(--font-display);letter-spacing:var(--display-tracking);display:flex;align-items:center;gap:.5rem}
.logo svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2.2}
.mast nav{display:flex;gap:1.6rem;color:var(--fg-soft)}
.mast a{color:inherit;text-decoration:none}
/* toggle bar */
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:1.2rem;padding-top:.7rem;padding-bottom:.7rem;transition:background .4s,border-color .4s}
.bar .lab{font:500 .72rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft)}
.sw{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--fg);border-radius:var(--radius);background:var(--bg-alt);max-width:760px;width:100%;margin-left:auto;transition:border-radius .3s}
.sw button{position:relative;z-index:2;background:none;border:0;color:var(--fg);font:600 clamp(.85rem,1.8vw,1.15rem) var(--font-display);letter-spacing:var(--display-tracking);padding:.95rem 1rem;cursor:pointer;display:flex;gap:.6rem;align-items:baseline;justify-content:center;transition:color .3s}
.sw button small{font:400 .66rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.sw button[aria-checked=true]{color:var(--accent-ink)}
.thumb{position:absolute;z-index:1;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--accent);border-radius:calc(var(--radius) - 1px);transition:transform .28s var(--ease),background .4s}
[data-aud=founders] .thumb{transform:translateX(100%);width:calc(50% - 3px)}
.sw button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(1.5rem,5vw,5rem);padding-top:clamp(2.5rem,7vw,6rem);padding-bottom:clamp(2.5rem,6vw,5rem);align-items:end}
.kick{display:inline-block;font:500 .74rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase;background:var(--hot);color:#111;padding:.3rem .6rem;border-radius:var(--radius);margin-bottom:1.4rem}
h1{font:var(--display-weight) clamp(2.6rem,7vw,6rem)/.98 var(--font-display);letter-spacing:var(--display-tracking);text-wrap:balance}
.lede{margin-top:1.6rem;max-width:36rem;font-size:1.12rem;color:var(--fg-soft)}
.facts{font:400 .84rem/1 var(--font-mono);border:1px solid var(--rule);border-radius:var(--radius);padding:.4rem 1.1rem;background:var(--bg-alt)}
.facts div{display:flex;justify-content:space-between;gap:1rem;padding:.9rem 0;border-bottom:1px dashed var(--rule)}
.facts div:last-child{border:0}.facts span:first-child{color:var(--fg-soft)}.facts span:last-child{text-align:right;font-weight:500}
/* ledger */
.sec-h{font:500 .74rem var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-soft);padding:0 0 1rem;border-bottom:1.5px solid var(--fg)}
.rows .row{display:grid;grid-template-columns:minmax(7rem,14rem) 1fr;gap:2rem;padding:2rem 0;border-bottom:1px solid var(--rule);align-items:baseline;transition:background .2s}
.rows h3{font:var(--display-weight) clamp(1.8rem,4vw,3.2rem)/1 var(--font-display);letter-spacing:var(--display-tracking);color:var(--accent)}
.rows p{max-width:44rem;font-size:1.12rem}
.rows .row:hover{background:linear-gradient(90deg,transparent,var(--bg-alt))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,5rem);padding-top:4rem;padding-bottom:4rem}
ol{list-style:none;padding:0;counter-reset:s}
ol li{counter-increment:s;display:grid;grid-template-columns:3.2rem 1fr;padding:1rem 0;border-bottom:1px solid var(--rule);font-size:1.1rem}
ol li::before{content:counter(s,decimal-leading-zero);font:500 .85rem var(--font-mono);color:var(--accent);padding-top:.25rem}
.price div{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--rule)}
.price b{font:var(--display-weight) 1.5rem var(--font-display);letter-spacing:var(--display-tracking)}
.price span{color:var(--fg-soft);font-size:.9rem}
.cta{background:var(--accent);color:var(--accent-ink);padding-top:clamp(3rem,7vw,5.5rem);padding-bottom:clamp(3rem,7vw,5.5rem);display:flex;justify-content:space-between;align-items:end;gap:2rem;flex-wrap:wrap;transition:background .4s}
.cta h2{font:var(--display-weight) clamp(2rem,5vw,4rem)/1 var(--font-display);letter-spacing:var(--display-tracking);max-width:18ch}
.cta a{background:var(--hot);color:#111;text-decoration:none;font:600 1rem var(--font-display);padding:1rem 1.6rem;border-radius:var(--radius);transition:transform .2s}
.cta a:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 #111}
.cta button{background:none;border:0;color:inherit;opacity:.8;text-decoration:underline;font:inherit;cursor:pointer;margin-top:1rem;display:block}
footer{padding-top:1.5rem;padding-bottom:2rem;display:flex;justify-content:space-between;font:400 .75rem var(--font-mono);color:var(--fg-soft)}
/* theme wipe */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:wipe .7s var(--ease) both;z-index:9999}
@keyframes wipe{from{clip-path:circle(0 at var(--x,50%) var(--y,10%))}to{clip-path:circle(150vmax at var(--x,50%) var(--y,10%))}}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}.rows .row{grid-template-columns:1fr;gap:.6rem}.mast nav{display:none}.bar{grid-template-columns:1fr}.bar .lab{display:none}.sw button small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}::view-transition-new(root){animation:none}}
</style>
</head>
<body>
<header class="mast pad"><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 22V12M12 12C12 7 6 8 6 2M12 12c0-5 6-4 6-10"/></svg>Fork</div><nav><a href="#rows">Services</a><a href="#how">How it works</a><a href="#cta">Talk</a></nav></header>

<div class="bar pad" role="radiogroup" aria-label="Choose your audience">
  <span class="lab">I am…</span>
  <div class="sw" id="sw">
    <span class="thumb"></span>
    <button role="radio" aria-checked="true" data-pick="ops">running a business <small>Operators</small></button>
    <button role="radio" aria-checked="false" data-pick="founders">building a company <small>Founders</small></button>
  </div>
</div>

<section class="hero pad">
  <div><span class="kick" data-t="kick"></span><h1 data-t="h1"></h1><p class="lede" data-t="lede"></p></div>
  <div class="facts" id="facts"></div>
</section>

<section class="pad" id="rows"><div class="sec-h">What we do for you</div><div class="rows" id="rowsList"></div></section>

<section class="two pad" id="how">
  <div><div class="sec-h">How it goes</div><ol id="steps"></ol></div>
  <div><div class="sec-h">What it costs</div><div class="price" id="price"></div></div>
</section>

<section class="cta pad" id="cta"><div><h2 data-t="ctah"></h2><button id="swap"></button></div><a href="mailto:hello@fork.example" data-t="cta"></a></section>
<footer class="pad"><span>Fork · hello@fork.example</span><span>One site. Two ways in.</span></footer>

<script>
const T={
ops:{kick:'For operators',h1:'Your website should run like the rest of your shop.',lede:"You have customers, staff, and a schedule. You don't have time to babysit a website. We build it, host it, and keep it fixed — and answer the phone when you call.",
facts:[['Launch','5–7 weeks'],['Typical client','8–60 staff'],['Support','A person, by phone'],['Lock-in','None']],
rows:[['Build','Booking, quotes, service areas, menus, hours — wired to the tools you already use, so you stop double-entering.'],['Host','Fast, boring, always on. Backups before every change. If it goes down at 6 a.m. before the lunch rush, we are already looking.'],['Care','Edits by email or text. Seasonal changes, holiday hours, new hires — handled the day you ask.']],
steps:['Walk the floor — we learn how work actually flows.','Draw it — pages sketched around your day, not ours.','Build and stage — you click through a private copy.','Launch and train your staff in an hour.'],
price:[['Build','from $6,500','fixed quote'],['Host','$79 / mo','domain, TLS, backups'],['Care','$249 / mo','includes hosting + 3 edit hrs']],
ctah:'Tell us how the business runs.',cta:'Book a call →',swap:'Actually, I\'m a founder →',to:'founders'},
founders:{kick:'For founders',h1:'Ship the site while you ship the product.',lede:"You're hiring, raising, and iterating. Your site can't be a side quest. We build it in your repo, host it with preview deploys, and stay on call while it changes weekly.",
facts:[['Launch','2–3 weeks'],['Stack','Next.js · Astro · yours'],['Previews','Every pull request'],['Contract','Monthly']],
rows:[['Build','Marketing site, docs, changelog, pricing — in your repo, your design system, your CI. Content in MDX or the CMS you already pay for.'],['Host','Global edge, a preview URL for every pull request, one-click rollbacks. Your DNS, our pager.'],['Care','One-day turnaround on iterations. Launch-week surge capacity. Redirects when you rename the product (again).']],
steps:['Read the deck — positioning before pixels.','Wire to the product — tokens, components, copy.','Ship v1 in two weeks, behind a preview link.','Iterate weekly. Cancel monthly.'],
price:[['Sprint build','from $4,800','2 weeks, fixed'],['Host','$79 / mo','edge + previews + rollbacks'],['Care','$249 / mo','3 hrs · or Care+ $499 / 10 hrs']],
ctah:'Send us the deck and the deadline.',cta:'Start a sprint →',swap:'Actually, I run a business →',to:'ops'}};
const root=document.documentElement,btns=[...document.querySelectorAll('.sw button')];
function paint(a){const c=T[a];
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=c[e.dataset.t]);
  facts.innerHTML=c.facts.map(f=>`<div><span>${f[0]}</span><span>${f[1]}</span></div>`).join('');
  rowsList.innerHTML=c.rows.map(r=>`<div class="row"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join('');
  steps.innerHTML=c.steps.map(s=>`<li>${s}</li>`).join('');
  price.innerHTML=c.price.map(p=>`<div><span><b>${p[0]}</b><br><span>${p[2]}</span></span><b>${p[1]}</b></div>`).join('');
  swap.textContent=c.swap;swap.onclick=()=>set(c.to);
  root.dataset.aud=a;btns.forEach(b=>b.setAttribute('aria-checked',b.dataset.pick===a));
  try{localStorage.setItem('fork-aud',a)}catch(e){}}
function set(a,ev){if(root.dataset.aud===a)return;
  const b=btns.find(x=>x.dataset.pick===a).getBoundingClientRect();
  root.style.setProperty('--x',(ev?ev.clientX:b.left+b.width/2)+'px');root.style.setProperty('--y',(ev?ev.clientY:b.top+b.height/2)+'px');
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.startViewTransition(()=>paint(a));else paint(a)}
btns.forEach(b=>{b.onclick=e=>set(b.dataset.pick,e);
  b.onkeydown=e=>{if(e.key==='ArrowRight')set('founders');if(e.key==='ArrowLeft')set('ops')}});
const q=new URLSearchParams(location.search).get('for');
let init='ops';try{init=q||localStorage.getItem('fork-aud')||'ops'}catch(e){init=q||'ops'}
paint(T[init]?init:'ops');
</script>
</body>
</html>
