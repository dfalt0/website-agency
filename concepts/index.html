<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nodus — design concept previews</title>
  <style>
    :root {
      --bg: #080A08;
      --fg: #E2E8E2;
      --muted: #8A948A;
      --line: #1A1F1A;
      --accent: #22C55E;
      --card: #0C0F0C;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }
    main {
      max-width: 78rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    h2 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
      margin: 2.25rem 0 0.85rem;
      color: var(--fg);
    }
    .sub { color: var(--muted); margin: 0 0 1.5rem; max-width: 42rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(17.5rem, 1fr));
      gap: 1rem;
    }
    a.card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 0.5px solid var(--line);
      overflow: hidden;
      transition: border-color 160ms ease, transform 160ms ease;
    }
    a.card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    a.card:hover .thumb img {
      transform: scale(1.03);
    }
    a.card.trad { border-color: #2a332a; }
    .thumb {
      aspect-ratio: 16 / 10;
      background: #111411;
      border-bottom: 0.5px solid var(--line);
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 220ms ease;
    }
    .meta { padding: 0.9rem 1rem 1.05rem; }
    .id {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .name { font-size: 1.05rem; }
    .arch { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }
  </style>
</head>
<body>
  <main>
    <h1>Design concepts</h1>
    <p class="sub">45 alternate brand + website directions. Each card shows a live preview snapshot — click through to open the full page.</p>

    <h2>01–05 · Original studio</h2>
    <div class="grid" id="g1"></div>

    <h2>06–15 · Traditional</h2>
    <p class="sub">Calmer traditional sites — each with a different familiar page structure.</p>
    <div class="grid" id="g2"></div>

    <h2>16–45 · Experimental layouts</h2>
    <div class="grid" id="g3"></div>
  </main>
  <script>
    const groups = {
      g1: [
        ["01-harbor", "Harbor", "Classic studio"],
        ["02-typefoundry", "Typefoundry", "Classic studio"],
        ["03-signal", "Signal", "Classic studio"],
        ["04-kiln", "Kiln", "Classic studio"],
        ["05-ledger", "Ledger", "Classic studio"],
      ],
      g2: [
        ["06-atelier", "Atelier", "Side rail + split hero"],
        ["07-practice", "Practice", "Letterhead document"],
        ["08-storefront", "Storefront", "Awning + info windows"],
        ["09-bureau", "Bureau", "Civic main/aside"],
        ["10-partner", "Partner", "Essay + year timeline"],
        ["11-commons", "Commons", "FAQ-first"],
        ["12-workshop", "Workshop", "Job board first"],
        ["13-clinic", "Clinic", "Booking + care table"],
        ["14-firm", "Firm", "Institutional lockup"],
        ["15-cornerstone", "Cornerstone", "Banner + consult form"],
      ],
      g3: [
        ["16-specimen", "Specimen", "Split macro essay"],
        ["17-briefing", "Briefing", "Operator briefing"],
        ["18-overlay", "Overlay", "Scene + overlays"],
        ["19-theater", "Theater", "Demo theater"],
        ["20-sponsor", "Sponsor", "Capital manifesto"],
        ["21-traverse", "Traverse", "Horizontal strip"],
        ["22-spread", "Spread", "Magazine spreads"],
        ["23-rail", "Rail", "TOC rail essay"],
        ["24-chapters", "Chapters", "Snap chapters"],
        ["25-schematic", "Schematic", "Blueprint sheets"],
        ["26-wall", "Wall", "Ops status wall"],
        ["27-poster", "Poster", "Type posters"],
        ["28-compare", "Compare", "Before/after scrubber"],
        ["29-catalog", "Catalog", "SKU catalog"],
        ["30-thread", "Thread", "Chat narrative"],
        ["31-canvas", "Canvas", "Artboard frames"],
        ["32-letter", "Letter", "Letterhead"],
        ["33-notebook", "Notebook", "Lab notebook"],
        ["34-cutaway", "Cutaway", "Cross-section"],
        ["35-scope", "Scope", "Scope calculator"],
        ["36-docket", "Docket", "Case-file tabs"],
        ["37-parcel", "Parcel", "Zoning board"],
        ["38-spine", "Spine", "Marker timeline"],
        ["39-fork", "Fork", "Dual-audience toggle"],
        ["40-monolith", "Monolith", "Dense essay"],
        ["41-stage", "Stage", "Spotlight stage"],
        ["42-shell", "Shell", "CLI shell"],
        ["43-strip", "Strip", "Filmstrip"],
        ["44-bench", "Bench", "Pegboard bench"],
        ["45-directory", "Directory", "A–Z directory"],
      ],
    };
    for (const [id, list] of Object.entries(groups)) {
      const grid = document.getElementById(id);
      for (const [slug, name, arch] of list) {
        const a = document.createElement("a");
        a.className = "card" + (id === "g2" ? " trad" : "");
        a.href = `./${slug}/preview`;
        a.innerHTML = `
          <div class="thumb">
            <img src="./_thumbs/${slug}.jpg" alt="${name} preview" loading="lazy" width="960" height="600" />
          </div>
          <div class="meta">
            <div class="id">${slug}</div>
            <div class="name">${name}</div>
            <div class="arch">${arch}</div>
          </div>`;
        grid.appendChild(a);
      }
    }
  </script>
</body>
</html>
